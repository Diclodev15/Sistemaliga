<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏀 Sistema Automático - Liga de Baloncesto</title>
<style>
body {font-family: Arial; background:#111; color:#eee; margin:0; padding:20px;}
h1 {text-align:center; color:#ff9800;}
.section {background:#1e1e1e; padding:15px; border-radius:10px; margin-bottom:20px;}
button {background:#ff9800; border:none; padding:8px 16px; margin:5px; border-radius:5px; cursor:pointer; color:#111;}
button:hover {background:#ffa733;}
input, textarea {width:100%; margin-top:5px; padding:6px; border-radius:6px; border:none; background:#000; color:#0f0;}
.teams {display:flex; justify-content:space-between; flex-wrap:wrap;}
.team {width:45%;}
.team ul {list-style:none; padding:0;}
.standby {color:#03a9f4;}
</style>
</head>
<body>

<h1>🏀 Sistema Automático - Liga de Baloncesto</h1>

<!-- Configuración inicial -->
<div class="section" id="setup">
  <h2>Configuración inicial</h2>
  <label>Integrantes de la Liga:</label>
  <textarea id="ligaInput" placeholder="Ej: Max, Eliam, Xiolin..."></textarea>
  <label>Invitados:</label>
  <textarea id="invInput" placeholder="Ej: Juan, Jorge, Boca..."></textarea>
  <button onclick="iniciarLiga()">Iniciar Liga</button>
</div>

<!-- Panel de control -->
<div class="section" id="gamePanel" style="display:none;">
  <div id="status"></div>

  <div class="teams">
    <div class="team">
      <h2>Equipo A (Campeón)</h2>
      <ul id="teamA"></ul>
    </div>
    <div class="team">
      <h2>Equipo B (Retador)</h2>
      <ul id="teamB"></ul>
    </div>
  </div>

  <div class="section">
    <button onclick="winner('A')">🏆 Gana Equipo A</button>
    <button onclick="winner('B')">🏆 Gana Equipo B</button>
  </div>

  <div class="section">
    <h3>Colas Actuales</h3>
    <p><strong>Liga:</strong> <span id="ligaList"></span></p>
    <p><strong>Invitados:</strong> <span id="invList"></span></p>
    <p class="standby"><strong>Standby:</strong> <span id="standbyList"></span></p>
  </div>

  <div class="section">
    <h3>Agregar Nuevos Jugadores</h3>
    <label>Agregar a la Liga:</label>
    <input id="nuevoLiga" placeholder="Nombre jugador de liga">
    <button onclick="agregarJugador('liga')">Agregar Liga</button>
    <br><br>
    <label>Agregar a Invitados:</label>
    <input id="nuevoInv" placeholder="Nombre jugador invitado">
    <button onclick="agregarJugador('invitado')">Agregar Invitado</button>
  </div>
</div>

<script>
let liga = [];
let invitados = [];
let champion = [];
let retador = [];
let standby = [];
let matchNumber = 1;
let consecutiveWins = 0;

// === FUNCIONES BASE ===
function parseList(txt) {
  return txt.split(/,|\n/).map(n=>n.trim()).filter(n=>n.length>0);
}

function iniciarLiga() {
  liga = parseList(document.getElementById('ligaInput').value);
  invitados = parseList(document.getElementById('invInput').value);

  if (liga.length < 5) {
    alert("Se necesitan al menos 5 jugadores de la liga.");
    return;
  }

  document.getElementById('setup').style.display = "none";
  document.getElementById('gamePanel').style.display = "block";

  iniciarPartido();
}

function agregarJugador(tipo){
  if (tipo==='liga'){
    const nombre = document.getElementById('nuevoLiga').value.trim();
    if (nombre){ liga.push(nombre); document.getElementById('nuevoLiga').value=''; }
  } else {
    const nombre = document.getElementById('nuevoInv').value.trim();
    if (nombre){ invitados.push(nombre); document.getElementById('nuevoInv').value=''; }
  }
  render();
}

// === LÓGICA DE ROTACIÓN ===
function tomarJugadores(lista, n){
  let arr=[];
  for(let i=0;i<n;i++){
    if(lista.length===0) break;
    arr.push(lista.shift());
  }
  return arr;
}

function completarJugadores(n){
  let jugadores = tomarJugadores(liga, n);
  if (jugadores.length < n) {
    jugadores = jugadores.concat(tomarJugadores(invitados, n - jugadores.length));
  }
  return jugadores;
}

function iniciarPartido(){
  // Si hay equipo en standby, vuelve a ser campeón
  if (standby.length === 5) {
    champion = standby;
    standby = [];
    consecutiveWins = 0;
  }

  if (matchNumber === 1) {
    // Primer partido: solo liga (10 primeros)
    const primeros = completarJugadores(10);
    champion = primeros.slice(0,5);
    retador = primeros.slice(5,10);
  } else {
    // Siguientes partidos: 3 liga + 2 invitados
    const ligaPart = completarJugadores(3);
    const invPart = tomarJugadores(invitados, 2);
    const total = ligaPart.concat(invPart);
    // Si faltan invitados, completa con liga
    while (total.length < 5) {
      const extra = tomarJugadores(liga, 1);
      if (extra.length) total.push(extra[0]);
      else break;
    }
    retador = total;
  }

  render();
}

// === RESULTADOS ===
function winner(team){
  if (team === 'A'){
    consecutiveWins++;
    // Retador pierde → vuelve a sus colas
    enviarPerdedoresACola(retador);

    if (consecutiveWins === 2){
      standby = champion;
      champion = [];
      consecutiveWins = 0;
      generar10Nuevos();
      return;
    }
  } else {
    // Campeón pierde → va a la cola
    enviarPerdedoresACola(champion);
    champion = retador;
    consecutiveWins = 1;
  }

  matchNumber++;
  iniciarPartido();
}

function enviarPerdedoresACola(equipo){
  equipo.forEach(j=>{
    if (!liga.includes(j) && !invitados.includes(j)) {
      if (document.getElementById('invInput').value.includes(j)) invitados.push(j);
      else liga.push(j);
    }
  });
}

function generar10Nuevos(){
  const nuevos = completarJugadores(10);
  champion = nuevos.slice(0,5);
  retador = nuevos.slice(5,10);
  matchNumber++;
  render();
}

function render(){
  document.getElementById("teamA").innerHTML = champion.map(p=>`<li>${p}</li>`).join("");
  document.getElementById("teamB").innerHTML = retador.map(p=>`<li>${p}</li>`).join("");
  document.getElementById("ligaList").textContent = liga.join(", ")||"Vacío";
  document.getElementById("invList").textContent = invitados.join(", ")||"Vacío";
  document.getElementById("standbyList").textContent = standby.join(", ")||"Ninguno";
  document.getElementById("status").innerHTML = `<h2>Partido ${matchNumber}</h2><p>Racha del campeón: ${consecutiveWins}</p>`;
}
</script>
</body>
</html>
